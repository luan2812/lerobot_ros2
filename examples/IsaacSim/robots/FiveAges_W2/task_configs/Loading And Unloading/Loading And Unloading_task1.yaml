task_queue:
  # 1. 回到home姿态
  - skill: joint.movej_to_config
    id: home_pose

  # 2. 底盘运动
  - skill: nav.navigate_to_object
    id: nav_to_carry_1


  # 3. 左臂抓取板件3（预备姿态）
  - skill: joint.movej_to_config
    id: left_pose_1_1
  
  # 5. 左臂抓取板件3（预备姿态）
  - skill: joint.movej_to_config
    id: left_pose_1

  # #拿件测试
  # - skill: single_arm.move_relative
  #   id: left_pick_1
  # 6. 并行，左臂取出板件3
  # - skill: joint.movej_to_config
  - parallel:
      # 左臂拿住板件3
      - skill: joint.movej_to_config
        id: left_pose_2
      # 左臂取出板件3
      - skill: joint.movej_to_config
        id: left_pose_3
        start_delay_s: 10.0

  # 7. 底盘运动
  - skill: nav.navigate_to_object
    id: nav_to_carry_2

  # 8. 左臂拿料,切右手准备姿态
  - skill: joint.movej_to_config
    id: left_pose_4

    # 9. 左臂拿料,切右手拿料
  - parallel:
      # 左臂拿住板件3,切右手姿态
      - skill: joint.movej_to_config
        id: left_pose_5
      # 右臂拿板件准备姿态
      - skill: joint.movej_to_config
        id: right_pose_1
        start_delay_s: 5.0




#10. 右臂拿料,左臂松手(手动松手)
  - skill: single_arm.pick
    id: right_pick_1
  

  # # 右臂放板件准备姿态
  # - skill: joint.movej_to_config
  #   id: left_pose_6


  # 右臂放板件准备姿态
  - skill: joint.movej_to_config
    id: right_pose_1

  # 左臂回home
  - skill: joint.movej_to_config
    id: left_pose_6

  - skill: joint.movej_to_config
    id: right_pose_2
      
    
    # 12. 底盘运动
  - skill: nav.navigate_to_object
    id: nav_to_carry_3

    # 13. 放件位置
  - skill: joint.movej_to_config
    id: right_pose_3


 

scene_presets:
  env_1: {}

record:
  base_record_overrides:
    task_name: pick_place
    fps: 30
    camera_info_timeout: 10.0
    enable_keypoint_pcd: false
    include_depth_feature: false
    image_writer_processes: 0
    image_writer_threads: 8
    video_encoding_batch_size: 5
  profiles:
    - key: default
      label: Default
      overrides: {}
    - key: fast
      label: Fast Encode Queue
      overrides:
        image_writer_threads: 12
        video_encoding_batch_size: 10