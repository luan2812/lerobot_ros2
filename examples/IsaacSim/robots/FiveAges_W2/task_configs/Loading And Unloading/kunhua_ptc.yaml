# FiveAges W2 — 单臂抓取放置（skill_defaults / skill_params）
#
# 合并顺序与 motion_main / 录制一致：base 扁平化 → skill_defaults → 场景 → skill_params

task_key: kunhua_pick_place
label: "Kunhua PTC加热"
use_stamped: true
robot_id: fiveages_w2_pick_place
default_scene: stage1

base_task_overrides:
  base_link_entity_path: /word/W2_v1_01/FiveAges_W2/LinkHou_S2/base_footprint/visuals/base_link
  max_stage_duration: 2.0
  pose_tol_pos: 0.01
  pose_tol_ori: 0.08
  require_orientation_reach: false
  use_object_orientation: false

