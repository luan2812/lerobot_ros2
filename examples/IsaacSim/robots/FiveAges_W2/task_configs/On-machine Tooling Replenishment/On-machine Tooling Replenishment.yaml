# FiveAges W2 — 导航到箱体附近后双臂拿起叶片返回工作台（navigate_and_pick + bimanual_carry 拼合）
#
# 合并顺序：base → single_arm.pick（供 nav 默认物体路径）→ dual_arm.carry → 场景 skill_params
# 队列：并行「导航 + navigate_gesture」→ pre_ocs2_* → carry →
#   navigate_backup(0.5m) → 并行「send_nav_goal(0,0) + 降腰 MoveJ」→ wait_nav_arrived → 双臂回队列起势位姿

# 任务标识，用于调度系统识别该任务类型
task_key: On-machine Tooling Replenishment
# 任务显示名称，可用于记录和界面展示
label: 线边库循环补料
# 是否使用时间戳参数进行任务同步与调度
use_stamped: true
# 默认场景名称，指定该任务使用的场景预设
default_scene: env_1




runtime_defaults:
  # 机器人基座实体路径，必须与当前 IsaacSim 场景中实际加载的机器人 prim 对齐
  base_link_entity_path: /World/robot/FiveAges_W2/LinkHou_S2/base_footprint/base_link
  # 每个阶段最大的允许执行时长，超过后会判定失败或超时终止
  max_stage_duration: 2.0
  # 任务执行中的位置容差，单位米，控制机器人到位精度
  pose_tol_pos: 0.01 
  # 任务执行中的姿态容差，单位弧度，控制方向/朝向精度
  pose_tol_ori: 0.08


skill_defaults:
  # 回home姿态
  home_pose:
    # joint.movej_to_config
    body_positions: [-0.85, -1.7, -0.85, 0.0]
    left_arm_positions: [-0.0085, 0.6068, 0.5229, -2.4910, -1.0119, 0.4304, -0.0486]
    right_arm_positions: [0.0085, 0.6068, -0.5229, -2.4910, 1.0119, 0.4304, 0.0486]
    arrival_timeout: 30.0
    joint_tolerance: 0.05
    # body_movej_duration: 4.0

  nav_to_carry_1:
      # 目标物体在场景中的路径，用于导航定位和接近目标
      object_prim_path: /World/scenes_1/Box_01/Mesh_179
      # 从当前机器人姿态到目标前方的 X 轴偏移，正值表示目标前方 0.95m
      approach_offset_x: -0.0
      # 从当前机器人姿态到目标侧面的 Y 轴偏移，控制靠近的横向位置
      approach_offset_y: 0.7
      # 导航到目标后朝向角，弧度制
      yaw: -1.57
      # 目标位姿所在坐标系，通常使用 map 表示全局坐标系
      frame_id: map
      # 导航到目标的超时时间，单位秒
      timeout: 60.0
  # 抓取预备姿态
  pose_1:
    # joint.movej_to_config
    body_positions: [-0.85, -1.7, -0.85, 0.0]
    left_arm_positions: [0.1961, -0.6759, 0.2529, -1.6421, -0.2568, 0.2029, -0.2181]
    right_arm_positions: [-0.1961, -0.6759, -0.2529, -1.6421, 0.2568, 0.2029, 0.2181]
    arrival_timeout: 30.0
    joint_tolerance: 0.05

# 双臂同时抓取
  dual_arm_pick_1:
    left_pick:
      object_prim_path: /World/scenes_1/Box_01/Mesh_179
      #相对物体中心的抓取偏移
      object_position_offset: [-0.05, -0.1, 0.13]
      # 抓取姿态四元数
      ee_base_orientation: [-0.7, 0.7, -0.3, 0.0]
      #抓取后抬升
#      ee_lift_offset: [0.0, 0.0, -0.1]
    right_pick:
      object_prim_path: /World/scenes_1/Box_01/Mesh_179
      #相对物体中心的抓取偏移(第一个数左右，第二个数上下，第三个数前后）
      object_position_offset: [-0.05, -0.1, -0.14]

      # 抓取姿态四元数
      ee_base_orientation: [0.7, 0.7, 0.3, 0.0]


  #目标姿态
  move_relative_left_1:
    arm: left
    motion_frame_id: arm_base
    position_delta: [ -0.1, 0.0, 0.17 ]
    orientation_delta_rpy: [ 0.0, -0.0, 0.0 ]
  move_relative_right_1:
    arm: right
    motion_frame_id: arm_base
    position_delta: [ -0.1, 0.0, 0.17 ]
    orientation_delta_rpy: [ 0.0, -0.0, 0.0 ]

  nav_to_carry_2:
      # 目标物体在场景中的路径，用于导航定位和接近目标
      object_prim_path: /World/scenes_1/Box_01/Mesh_179
      # 从当前机器人姿态到目标前方的 X 轴偏移，正值表示目标前方 0.95m
      approach_offset_x: -0.0
      # 从当前机器人姿态到目标侧面的 Y 轴偏移，控制靠近的横向位置
      approach_offset_y: 0.8
      # 导航到目标后朝向角，弧度制
      yaw: 3.14
      # 目标位姿所在坐标系，通常使用 map 表示全局坐标系
      frame_id: map
      # 导航到目标的超时时间，单位秒
      timeout: 60.0



  nav_to_carry_3:
      # 目标物体在场景中的路径，用于导航定位和接近目标
      object_prim_path: /World/scenes_1/ChargingCar_2/装配体205/板面_3/Mesh_172
      # 从当前机器人姿态到目标前方的 X 轴偏移，正值表示目标前方 0.95m
      approach_offset_x: 0.0
      # 从当前机器人姿态到目标侧面的 Y 轴偏移，控制靠近的横向位置
      approach_offset_y: -1.3
      # 导航到目标后朝向角，弧度制
      yaw: 1.57
      # 目标位姿所在坐标系，通常使用 map 表示全局坐标系
      frame_id: map
      # 导航到目标的超时时间，单位秒
      timeout: 60.0
  nav_to_carry_4:
      # 目标物体在场景中的路径，用于导航定位和接近目标
      object_prim_path: /World/scenes_1/ChargingCar_2/装配体205/板面_3/Mesh_172
      # 从当前机器人姿态到目标前方的 X 轴偏移，正值表示目标前方 0.95m
      approach_offset_x: 0.0
      # 从当前机器人姿态到目标侧面的 Y 轴偏移，控制靠近的横向位置
      approach_offset_y: -0.95
      # 导航到目标后朝向角，弧度制
      yaw: 1.57
      # 目标位姿所在坐标系，通常使用 map 表示全局坐标系
      frame_id: map
      # 导航到目标的超时时间，单位秒
      timeout: 60.0



  #目标姿态
  move_relative_left_2:
    arm: left
    motion_frame_id: arm_base
    position_delta: [ 0.1, 0.0, -0.09]
    orientation_delta_rpy: [ 0.0,  0.0, 0.0 ]
  move_relative_right_2:
    arm: right
    motion_frame_id: arm_base
    position_delta: [ 0.1, 0.0, -0.09 ]
    orientation_delta_rpy: [ 0.0, 0.0, 0.0 ]


  #目标姿态
  move_relative_left_3:
    arm: left
    motion_frame_id: arm_base
    position_delta: [ -0.0, 0.0, 0.09 ]
    orientation_delta_rpy: [ 0.0, -0.0, 0.0 ]
    gripper: 1.0
  move_relative_right_3:
    arm: right
    motion_frame_id: arm_base
    position_delta: [ -0.1, 0.0, 0.09 ]
    orientation_delta_rpy: [ 0.0, -0.0, 0.0 ]
    gripper: 1.0

  #目标姿态
  move_relative_left_4:
    arm: left
    motion_frame_id: arm_base
    position_delta: [ -0.0, 0.1, 0.0 ]
    orientation_delta_rpy: [ 0.0, -0.0, 0.0 ]
  move_relative_right_4:
    arm: right
    motion_frame_id: arm_base
    position_delta: [ -0.0, 0.0, 0.0 ]
    orientation_delta_rpy: [ 0.0, -0.2, 0.0 ]

  #目标姿态
  move_relative_left_5:
    arm: left
    motion_frame_id: arm_base
    position_delta: [ 0.1, 0.0, -0.09 ]
    orientation_delta_rpy: [ 0.0, -0.2, 0.0 ]
  move_relative_right_5:
    arm: right
    motion_frame_id: arm_base
    position_delta: [ -0.05, 0.0, 0.05 ]
    orientation_delta_rpy: [ 0.0, -0.0, 0.0 ]

  #目标姿态
  move_relative_left_6:
    arm: left
    motion_frame_id: arm_base
    position_delta: [ -0.0, -0.15, 0.0 ]
    orientation_delta_rpy: [ 0.0, -0.0, 0.0 ]
  move_relative_right_6:
    arm: right
    motion_frame_id: arm_base
    position_delta: [ -0.0, 0.0, 0.0 ]
    orientation_delta_rpy: [ 0.0, -0.0, 0.0 ]
  #目标姿态
  move_relative_left_7:
    arm: left
    motion_frame_id: arm_base
    position_delta: [ -0.0, 0.1, 0.0 ]
    orientation_delta_rpy: [ 0.0, -0.0, 0.0 ]
  move_relative_right_7:
    arm: right
    motion_frame_id: arm_base
    position_delta: [ -0.0, 0.0, 0.0 ]
    orientation_delta_rpy: [ 0.0, -0.0, 0.0 ]
task_queue:
#   1. 回到home姿态
  - skill: joint.movej_to_config
    id: home_pose

  # 2. 底盘运动
  - skill: nav.navigate_to_object
    id: nav_to_carry_1

#
  # 3. 双臂抓取板件1（预备姿态）
  - skill: joint.movej_to_config
    id: pose_1
  # 4. 双臂同时抓取板件3
  - skill: dual_arm.parallel_pick
    id: dual_arm_pick_1
##
#  7. 抬手臂
  - parallel:
    - skill: single_arm.move_relative
      id: move_relative_left_1
    - skill: single_arm.move_relative
      id: move_relative_right_1
#
####
  # . 底盘运动
  - skill: nav.navigate_to_object
    id: nav_to_carry_2


  - skill: nav.navigate_to_object
    id: nav_to_carry_3
  - skill: nav.navigate_to_object
    id: nav_to_carry_4
#  7. 抬手臂
  - parallel:
    - skill: single_arm.move_relative
      id: move_relative_left_2
    - skill: single_arm.move_relative
      id: move_relative_right_2
#

#  7. 抬手臂
  - parallel:
    - skill: single_arm.move_relative
      id: move_relative_left_3
    - skill: single_arm.move_relative
      id: move_relative_right_3

#  7. 抬手臂
  - parallel:
    - skill: single_arm.move_relative
      id: move_relative_left_4
    - skill: single_arm.move_relative
      id: move_relative_right_4

  - parallel:
    - skill: single_arm.move_relative
      id: move_relative_left_5
    - skill: single_arm.move_relative
      id: move_relative_right_5
  - parallel:
    - skill: single_arm.move_relative
      id: move_relative_left_6
    - skill: single_arm.move_relative
      id: move_relative_right_6
  - parallel:
    - skill: single_arm.move_relative
      id: move_relative_left_7
    - skill: single_arm.move_relative
      id: move_relative_right_7

  # 2. 底盘运动
  - skill: nav.navigate_to_object
    id: nav_to_carry_3

  - skill: joint.movej_to_config
    id: home_pose


scene_presets:
  env_1: {}

record:
  base_record_overrides:
    task_name: pick_place
    fps: 30
    camera_info_timeout: 10.0
    enable_keypoint_pcd: false
    include_depth_feature: false
    image_writer_processes: 0
    image_writer_threads: 8
    video_encoding_batch_size: 5
  profiles:
    - key: default
      label: Default
      overrides: {}
    - key: fast
      label: Fast Encode Queue
      overrides:
        image_writer_threads: 12
        video_encoding_batch_size: 10