# FiveAges W2 — 导航到箱体附近后双臂拿起叶片返回工作台（navigate_and_pick + bimanual_carry 拼合）
#
# 合并顺序：base → single_arm.pick（供 nav 默认物体路径）→ dual_arm.carry → 场景 skill_params
# 队列：并行「导航 + navigate_gesture」→ pre_ocs2_* → carry →
#   navigate_backup(0.5m) → 并行「send_nav_goal(0,0) + 降腰 MoveJ」→ wait_nav_arrived → 双臂回队列起势位姿

# 任务标识，用于调度系统识别该任务类型
task_key: Lightning Arrester Testing
# 任务显示名称，可用于记录和界面展示
label: 避雷器检测
# 是否使用时间戳参数进行任务同步与调度
use_stamped: true
# 默认场景名称，指定该任务使用的场景预设
default_scene: env_1

runtime_defaults:
  # 机器人基座实体路径，必须与当前 IsaacSim 场景中实际加载的机器人 prim 对齐
  base_link_entity_path: /World/robot/FiveAges_W2/LinkHou_S2/base_footprint/base_link
  # 每个阶段最大的允许执行时长，超过后会判定失败或超时终止
  max_stage_duration: 2.0
  # 任务执行中的位置容差，单位米，控制机器人到位精度
  pose_tol_pos: 0.01 
  # 任务执行中的姿态容差，单位弧度，控制方向/朝向精度
  pose_tol_ori: 0.08


skill_defaults:
  # 回home姿态
  home_pose:
    # joint.movej_to_config
    body_positions: [-0.6, -1.2, -0.6, 0.0]
    left_arm_positions: [0.3810, 0.9665, 0.8517, -2.3582, -0.8916, -1.0037, -0.3983]
    right_arm_positions: [-0.3809, 0.9665, -0.8518, -2.3582, 0.8914, -1.0037, 0.3983]
    arrival_timeout: 30.0
    joint_tolerance: 0.05
    # body_movej_duration: 4.0

  nav_to_carry_1:
    # 目标物体在场景中的路径，用于导航定位和接近目标
    object_prim_path: /World/scenes_1/material_frame/Lightning_Arrester/Mesh_515
    # 从当前机器人姿态到目标前方的 X 轴偏移，正值表示目标前方 0.95m
    approach_offset_x: 0.7
    # 从当前机器人姿态到目标侧面的 Y 轴偏移，控制靠近的横向位置
    approach_offset_y: 0.2
    # 导航到目标后朝向角，弧度制
    yaw: -3.14
    # 目标位姿所在坐标系，通常使用 map 表示全局坐标系
    frame_id: map
    # 导航到目标的超时时间，单位秒
    timeout: 60.0
  # 抓取预备姿态
  pose_1:
    # joint.movej_to_config
    body_positions: [-0.77, -1.54, -0.77, 0.0]
    left_arm_positions: [-1.5551, 1.2004, 2.0315, -1.8181, 1.2375, 0.4330, 0.0257]
    right_arm_positions: [-0.3809, 0.9665, -0.8518, -2.3582, 0.8914, -1.0037, 0.3983]
    arrival_timeout: 30.0
    joint_tolerance: 0.05

  #抓取避雷器
  single_arm_pick_1:
    arm: left
    motion_frame_id: arm_base
    arm_movel_duration: 2.0
    object_prim_path: /World/scenes_1/material_frame/Lightning_Arrester/Mesh_515
    #第一个数左右，第二个数上下，第三个数前后
    object_position_offset: [ 0.0, 0.23, -0.03 ]
    ee_base_orientation: [ -0.45, 0.45, -0.5, 0.5 ]


  #左臂抬起
  left_carry_1:
    arm: left
    motion_frame_id: arm_base
    arm_movel_duration: 2.0
    position: [0.57, 0.18, -0.1]
    orientation: [ -0.45, 0.45, -0.5, 0.5 ]
  #去放件中间点
  nav_to_carry_2:
    # 目标物体在场景中的路径，用于导航定位和接近目标
    object_prim_path: /World/scenes_1/MYD_02/Torus
    # 从当前机器人姿态到目标前方的 X 轴偏移，正值表示目标前方 0.95m
    approach_offset_x: -1.3
    # 从当前机器人姿态到目标侧面的 Y 轴偏移，控制靠近的横向位置
    approach_offset_y: -0.25
    # 导航到目标后朝向角，弧度制
    yaw: 0
    # 目标位姿所在坐标系，通常使用 map 表示全局坐标系
    frame_id: map
    # 导航到目标的超时时间，单位秒
    timeout: 60.0

  # 抓取预备姿态
  pose_2:
    # joint.movej_to_config
    body_positions: [ -0.5, -1.0, -0.5, 0.0 ]
    arrival_timeout: 30.0
    joint_tolerance: 0.05


  #去放件
  nav_to_carry_3:
    # 目标物体在场景中的路径，用于导航定位和接近目标
    object_prim_path: /World/scenes_1/MYD_02/Torus
    # 从当前机器人姿态到目标前方的 X 轴偏移，正值表示目标前方 0.95m
    approach_offset_x: -0.7
    # 从当前机器人姿态到目标侧面的 Y 轴偏移，控制靠近的横向位置
    approach_offset_y: -0.1
    # 导航到目标后朝向角，弧度制
    yaw: 0
    # 目标位姿所在坐标系，通常使用 map 表示全局坐标系
    frame_id: map
    # 导航到目标的超时时间，单位秒
    timeout: 60.0
  #左臂去放件
  move_to_object_1:
    # 工作臂：right / left
    arm: left
    # 目标物体 prim 路径
    object_prim_path: /World/scenes_1/MYD_02/Torus
    # 相对目标物体局部坐标系的偏移 [x, y, z]（不是 world 直接偏移）
    object_position_offset: [ 0.03, -0.005, 0.57 ]
    # 目标末端姿态四元数（xyzw）
    ee_base_orientation: [ -0.45, 0.45, -0.5, 0.5 ]
    # 执行/下发坐标系
    motion_frame_id: arm_base
    # TF 查询超时（秒）
    tf_lookup_timeout: 2.0
    # 执行前写入 arm_controller.movel_duration
    arm_movel_duration: 2.0

  move_to_object_2:
    # 工作臂：right / left
    arm: left
    # 目标物体 prim 路径
    object_prim_path: /World/scenes_1/MYD_02/Torus
    # 相对目标物体局部坐标系的偏移 [x, y, z]（不是 world 直接偏移）
    object_position_offset: [ 0.03, -0.005, 0.52 ]
    # 目标末端姿态四元数（xyzw）
    ee_base_orientation: [ -0.45, 0.45, -0.5, 0.5 ]
    # 执行/下发坐标系
    motion_frame_id: arm_base
    # TF 查询超时（秒）
    tf_lookup_timeout: 2.0
    # 执行前写入 arm_controller.movel_duration
    arm_movel_duration: 2.0
  #放件
  single_arm_place_1:
    arm: left
    object_prim_path: /World/scenes_1/MYD_02/Torus
    motion_frame_id: arm_base
    arm_movel_duration: 2.0
    #第一个数前后，第二个数左右，第三个数上下
    object_position_offset: [ 0.0, 0.0, 0.6 ]
    ee_base_orientation: [ -0.45, 0.45, -0.5, 0.5 ]


  nav_to_carry_4:
    # 目标物体在场景中的路径，用于导航定位和接近目标
    object_prim_path: /World/scenes_1/buggy_01/Torus_01
    # 从当前机器人姿态到目标前方的 X 轴偏移，正值表示目标前方 0.95m
    approach_offset_x: 1.2
    # 从当前机器人姿态到目标侧面的 Y 轴偏移，控制靠近的横向位置
    approach_offset_y: 0.2
    # 导航到目标后朝向角，弧度制
    yaw: 3.14
    # 目标位姿所在坐标系，通常使用 map 表示全局坐标系
    frame_id: map
    # 导航到目标的超时时间，单位秒
    timeout: 60.0
# 抓取预备姿态
  pose_3:
    # joint.movej_to_config
    body_positions: [ -0.0658, -0.1742, -0.0981, 0.0 ]
    arrival_timeout: 30.0
    joint_tolerance: 0.05

  nav_to_carry_5:
    # 目标物体在场景中的路径，用于导航定位和接近目标
    object_prim_path: /World/scenes_1/buggy_01/Torus_01
    # 从当前机器人姿态到目标前方的 X 轴偏移，正值表示目标前方 0.95m
    approach_offset_x: 0.7
    # 从当前机器人姿态到目标侧面的 Y 轴偏移，控制靠近的横向位置
    approach_offset_y: 0.2
    # 导航到目标后朝向角，弧度制
    yaw: 3.14
    # 目标位姿所在坐标系，通常使用 map 表示全局坐标系
    frame_id: map
    # 导航到目标的超时时间，单位秒
    timeout: 60.0

# 抓取预备姿态
  pose_4:
    # joint.movej_to_config
    body_positions: [ -0.5, -1.0, -0.5, 0.0 ]
    arrival_timeout: 30.0
    joint_tolerance: 0.05

  #左臂去放件
  move_to_object_3:
    # 工作臂：right / left
    arm: left
    # 目标物体 prim 路径
    object_prim_path: /World/scenes_1/buggy_01/Torus_01
    # 相对目标物体局部坐标系的偏移 [x, y, z]（不是 world 直接偏移）
    object_position_offset: [ -0.05, -0.005, 0.47 ]
    # 目标末端姿态四元数（xyzw）
    ee_base_orientation: [ -0.45, 0.45, -0.5, 0.5 ]
    # 执行/下发坐标系
    motion_frame_id: arm_base
    # TF 查询超时（秒）
    tf_lookup_timeout: 2.0
    # 执行前写入 arm_controller.movel_duration
    arm_movel_duration: 2.0

  move_to_object_4:
    # 工作臂：right / left
    arm: left
    # 目标物体 prim 路径
    object_prim_path: /World/scenes_1/buggy_01/Torus_01
    # 相对目标物体局部坐标系的偏移 [x, y, z]（不是 world 直接偏移）
    object_position_offset: [ -0.05, -0.005, 0.42 ]
    # 目标末端姿态四元数（xyzw）
    ee_base_orientation: [ -0.45, 0.45, -0.5, 0.5 ]
    # 执行/下发坐标系
    motion_frame_id: arm_base
    # TF 查询超时（秒）
    tf_lookup_timeout: 2.0
    # 执行前写入 arm_controller.movel_duration
    arm_movel_duration: 2.0
  #放件
  single_arm_place_2:
    arm: left
    object_prim_path: /World/scenes_1/buggy_01/Torus_01
    motion_frame_id: arm_base
    arm_movel_duration: 2.0
    object_position_offset: [ 0.0, 0.0, 0.5 ]
    ee_base_orientation: [ -0.45, 0.45, -0.5, 0.5 ]
    #第一个数前后，第二个数左右，第三个数上下

 

task_queue:
 #  1. 回到home姿态
  - skill: joint.movej_to_config
    id: home_pose

  # 2. 底盘运动
  - skill: nav.navigate_to_object
    id: nav_to_carry_1


  # 3. 预备姿态
  - skill: joint.movej_to_config
    id: pose_1
  # 4. 抓取避雷器（接触姿态）
  - skill: single_arm.pick
    id: single_arm_pick_1
  #5. 拿起避雷器
  - skill: single_arm.move_to_pose
    id: left_carry_1
  # 6. 底盘运动去放件——中间点
  - parallel:
      - skill: nav.navigate_to_object
        id: nav_to_carry_2
      - skill: joint.movej_to_config
        id: pose_2
        start_delay_s: 1.0

  # 7. 底盘运动去放件
  - skill: nav.navigate_to_object
    id: nav_to_carry_3
  #8. 放避雷器上方
  - skill: single_arm.move_to_object
    id: move_to_object_1
  #9. 放避雷器上方
  - skill: single_arm.move_to_object
    id: move_to_object_2
#   10. 放避雷器（接触姿态）
  - skill: single_arm.pick
    id: single_arm_place_1
#   11. 退出去
  - skill: nav.navigate_to_object
    id: nav_to_carry_2
# 12. 底盘运动去取件
  - skill: nav.navigate_to_object
    id: nav_to_carry_3
  # 13. 抓取避雷器（接触姿态）
  - skill: single_arm.pick
    id: single_arm_pick_1
  #14. 拿起避雷器
  - skill: single_arm.move_to_pose
    id: left_carry_1
#   15. 退出去
  - skill: nav.navigate_to_object
    id: nav_to_carry_2
#   16. 放件中间位置
  - skill: nav.navigate_to_object
    id: nav_to_carry_4
  # 17. 预备姿态
  - skill: joint.movej_to_config
    id: pose_3
#   18. 放件中间位置
  - skill: nav.navigate_to_object
    id: nav_to_carry_5
  # 19. 预备姿态
  - skill: joint.movej_to_config
    id: pose_4
  #20. 放避雷器上方
  - skill: single_arm.move_to_object
    id: move_to_object_3
  #21. 放避雷器上方
  - skill: single_arm.move_to_object
    id: move_to_object_4
  #22. 放避雷器（接触姿态）
  - skill: single_arm.pick
    id: single_arm_place_2
    #23
  - skill: nav.navigate_to_object
    id: nav_to_carry_4
    #24
  - skill: joint.movej_to_config
    id: home_pose

scene_presets:
  env_1: {}

record:
  base_record_overrides:
    task_name: pick_place
    fps: 30
    camera_info_timeout: 10.0
    enable_keypoint_pcd: false
    include_depth_feature: false
    image_writer_processes: 0
    image_writer_threads: 8
    video_encoding_batch_size: 5
  profiles:
    - key: default
      label: Default
      overrides: {}
    - key: fast
      label: Fast Encode Queue
      overrides:
        image_writer_threads: 12
        video_encoding_batch_size: 10