# FiveAges W2 — 导航到箱体附近后双臂拿起叶片返回工作台（navigate_and_pick + bimanual_carry 拼合）
#
# 合并顺序：base → single_arm.pick（供 nav 默认物体路径）→ dual_arm.carry → 场景 skill_params
# 队列：并行「导航 + navigate_gesture」→ pre_ocs2_* → carry →
#   navigate_backup(0.5m) → 并行「send_nav_goal(0,0) + 降腰 MoveJ」→ wait_nav_arrived → 双臂回队列起势位姿

# 任务标识，用于调度系统识别该任务类型
task_key: Loading And Unloading_V2_task1
# 任务显示名称，可用于记录和界面展示
label: 焊接上下件_板件1
# 是否使用时间戳参数进行任务同步与调度
use_stamped: true
# 默认场景名称，指定该任务使用的场景预设
default_scene: env_1




runtime_defaults:
  # 机器人基座实体路径，必须与当前 IsaacSim 场景中实际加载的机器人 prim 对齐
  base_link_entity_path: /World/robot/W2_v2/FiveAges_W2/LinkHou_S2/base_footprint/base_link
  # 每个阶段最大的允许执行时长，超过后会判定失败或超时终止
  max_stage_duration: 2.0
  # 任务执行中的位置容差，单位米，控制机器人到位精度
  pose_tol_pos: 0.01 
  # 任务执行中的姿态容差，单位弧度，控制方向/朝向精度
  pose_tol_ori: 0.08


skill_defaults:
  # 回home姿态
  home_pose:
    # joint.movej_to_config
    body_positions: [-0.6, -1.2, -0.6, 0.0]
    left_arm_positions: [0.3810, 0.9665, 0.8517, -2.3582, -0.8916, -1.0037, -0.3983]
    right_arm_positions: [-0.3809, 0.9665, -0.8518, -2.3582, 0.8914, -1.0037, 0.3983]
    arrival_timeout: 30.0
    joint_tolerance: 0.05
    # body_movej_duration: 4.0

  nav_to_carry_1:
    # 目标物体在场景中的路径，用于导航定位和接近目标
    object_prim_path: /World/scene/banjian_1/banjian_1/banjian_1
    # 从当前机器人姿态到目标前方的 X 轴偏移，正值表示目标前方 0.95m
    approach_offset_x: 0.6
    # 从当前机器人姿态到目标侧面的 Y 轴偏移，控制靠近的横向位置
    approach_offset_y: -0.1
    # 导航到目标后朝向角，弧度制
    yaw: -3.14
    # 目标位姿所在坐标系，通常使用 map 表示全局坐标系
    frame_id: map
    # 导航到目标的超时时间，单位秒
    timeout: 60.0
  # 抓取预备姿态
  pose_1:
    # joint.movej_to_config
    body_positions: [-0.6, -1.2, -0.6, 0.0]
    left_arm_positions: [-1.6528, 1.3228, 1.8032, -1.0308, -0.3045, -0.5568, 0.1129]
    right_arm_positions: [1.4748, 1.2885, -1.7911, -1.2003, 0.3020, -0.5676, -0.1492]
    arrival_timeout: 30.0
    joint_tolerance: 0.05

  #接触板件
  pose_2:
  # joint.movej_to_config
    body_positions: [-0.7112, -1.4125, -0.6987, 0.0]
    left_arm_positions: [ -1.6978, 1.3497, 1.7753, -0.9344, -0.2977, -0.5819, 0.0710 ]
    right_arm_positions: [ 1.4753, 1.2851, -1.7927, -1.2076, 0.2989, -0.5637, -0.1502 ]
    arrival_timeout: 30.0
    joint_tolerance: 0.05
      
  #站起来
  pose_3:
  # joint.movej_to_config
    body_positions: [-0.6, -1.2, -0.6, 0.0]
    arrival_timeout: 30.0
    joint_tolerance: 0.05
