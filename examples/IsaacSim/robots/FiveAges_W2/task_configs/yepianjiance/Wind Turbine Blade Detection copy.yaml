# FiveAges W2 — 导航到箱体附近后双臂拿起叶片返回工作台（navigate_and_pick + bimanual_carry 拼合）
#
# 合并顺序：base → single_arm.pick（供 nav 默认物体路径）→ dual_arm.carry → 场景 skill_params
# 队列：并行「导航 + navigate_gesture」→ pre_ocs2_* → carry →
#   navigate_backup(0.5m) → 并行「send_nav_goal(0,0) + 降腰 MoveJ」→ wait_nav_arrived → 双臂回队列起势位姿

# 任务标识，用于调度系统识别该任务类型
task_key: Wind Turbine Blade Detection1
# 任务显示名称，可用于记录和界面展示
label: 叶片检测
# 是否使用时间戳参数进行任务同步与调度
use_stamped: true
# 默认场景名称，指定该任务使用的场景预设
default_scene: box01

# 任务执行队列（按顺序依次执行）
task_queue:
  # 第一步：导航到目标物体附近
  - skill: nav.navigate_to_object
    # 该步骤实例 ID，用于在 skill_defaults 中配置参数
    id: nav_1

# 各任务步骤的默认参数（按步骤 id 组织）
skill_defaults:
  nav_1:
    # 目标物体在场景中的 prim 路径
    object_prim_path: /World/scene/boxes/white_box_05

    # 相对目标物体的接近偏移（米），负值表示在物体局部 x 反方向停靠
    approach_offset_x: -0.95
    # 相对目标物体的横向偏移（米）
    approach_offset_y: 0.0
    # 到达时朝向角（弧度）
    yaw: 0.0
    # 导航参考坐标系
    frame_id: map
    # 本步骤超时时间（秒）
    timeout: 60.0